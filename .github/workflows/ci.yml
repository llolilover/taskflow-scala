name: Scala CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      - name: Start PostgreSQL
        run: docker compose up -d db
      - name: Wait until PostgreSQL is ready
        run: |
          for i in {1..40}; do
            if docker compose exec -T db pg_isready -U taskflow -d taskflow; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Compile and run unit/integration tests
        env:
          TASKFLOW_INTEGRATION: '1'
        run: sbt -batch clean test
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v
